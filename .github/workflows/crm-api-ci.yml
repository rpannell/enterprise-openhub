name: CRM API CI

# Same per-project pattern as productmanager-api-ci.yml — see that file's comment.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/CRM/OpenHub.CRM.Api/**"
      - "src/CRM/OpenHub.CRM.Contracts/**"
      - "src/Platform/OpenHub.Platform.ServiceDefaults/**"
      - "src/Accessor/OpenHub.Accessor.KeyCloak/**"
      - "src/Accessor/OpenHub.Accessor.RabbitMq/**"
      - "tests/CRM/OpenHub.CRM.Api.Tests/**"
      - ".github/workflows/crm-api-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/CRM/OpenHub.CRM.Api/**"
      - "src/CRM/OpenHub.CRM.Contracts/**"
      - "src/Platform/OpenHub.Platform.ServiceDefaults/**"
      - "src/Accessor/OpenHub.Accessor.KeyCloak/**"
      - "src/Accessor/OpenHub.Accessor.RabbitMq/**"
      - "tests/CRM/OpenHub.CRM.Api.Tests/**"
      - ".github/workflows/crm-api-ci.yml"

concurrency:
  group: crm-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/CRM/OpenHub.CRM.Api/OpenHub.CRM.Api.csproj

      - name: Build
        run: dotnet build src/CRM/OpenHub.CRM.Api/OpenHub.CRM.Api.csproj --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore tests/CRM/OpenHub.CRM.Api.Tests/OpenHub.CRM.Api.Tests.csproj

      - name: Build tests
        run: dotnet build tests/CRM/OpenHub.CRM.Api.Tests/OpenHub.CRM.Api.Tests.csproj --configuration Release --no-restore

      # Unit tests only — see productmanager-api-ci.yml's comment on the Integration filter.
      - name: Run unit tests
        run: >
          dotnet test tests/CRM/OpenHub.CRM.Api.Tests/OpenHub.CRM.Api.Tests.csproj
          --configuration Release --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-api-test-results
          path: tests/CRM/OpenHub.CRM.Api.Tests/TestResults/test-results.trx
