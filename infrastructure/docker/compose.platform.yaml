name: openhubcrm-platform

services:

  #################################################
  # CONSUL CLUSTER
  #################################################

  consul-1:
    image: hashicorp/consul:1.20
    container_name: consul-1
    hostname: consul-1
    restart: unless-stopped
    command:
      - agent
      - -server
      - -bootstrap-expect=3
      - -ui
      - -client=0.0.0.0
      - -retry-join=consul-2
      - -retry-join=consul-3
    volumes:
      - ./consul/node1:/consul/data
    ports:
      - "8500:8500"
    networks:
      - enterprise-platform

  consul-2:
    image: hashicorp/consul:1.20
    container_name: consul-2
    hostname: consul-2
    restart: unless-stopped
    command:
      - agent
      - -server
      - -bootstrap-expect=3
      - -client=0.0.0.0
      - -retry-join=consul-1
      - -retry-join=consul-3
    volumes:
      - ./consul/node2:/consul/data
    networks:
      - enterprise-platform

  consul-3:
    image: hashicorp/consul:1.20
    container_name: consul-3
    hostname: consul-3
    restart: unless-stopped
    command:
      - agent
      - -server
      - -bootstrap-expect=3
      - -client=0.0.0.0
      - -retry-join=consul-1
      - -retry-join=consul-2

    volumes:
      - ./consul/node3:/consul/data

    networks:
      - enterprise-platform



  #################################################
  # VAULT CLUSTER
  #################################################

  vault-1:
    image: hashicorp/vault:1.18
    container_name: vault-1
    hostname: vault-1
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/node1:/vault/data
      - ./vault/config/vault-1.hcl:/vault/config/vault.hcl
    ports:
      - "8200:8200"
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - enterprise-platform

  vault-2:
    image: hashicorp/vault:1.18
    container_name: vault-2
    hostname: vault-2
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/node2:/vault/data
      - ./vault/config/vault-2.hcl:/vault/config/vault.hcl
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - enterprise-platform

  vault-3:
    image: hashicorp/vault:1.18
    container_name: vault-3
    hostname: vault-3
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/node3:/vault/data
      - ./vault/config/vault-3.hcl:/vault/config/vault.hcl
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - enterprise-platform
  keycloak:
        image: quay.io/keycloak/keycloak:26.3
        container_name: keycloak
        hostname: keycloak
        restart: unless-stopped
        command:
            - start-dev
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres-1:5432/keycloak
            KC_DB_USERNAME: keycloak
            KC_DB_PASSWORD: keycloak
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
        ports:
            - "8080:8080"
        networks:
            - enterprise-platform

        depends_on:
            - vault-1
            - consul-1

  kong-migrations:
    image: kong:3.9
    container_name: kong-migrations

    command:
        - kong
        - migrations
        - bootstrap
    environment:
        KONG_DATABASE: postgres
        KONG_PG_HOST: postgres-1
        KONG_PG_DATABASE: kong
        KONG_PG_USER: kong
        KONG_PG_PASSWORD: kong
    networks:
        - enterprise-platform
  kong:
    image: kong:3.9
    container_name: kong
    hostname: kong
    restart: unless-stopped
    depends_on:
        - kong-migrations
    environment:
        KONG_DATABASE: postgres
        KONG_PG_HOST: postgres-1
        KONG_PG_DATABASE: kong
        KONG_PG_USER: kong
        KONG_PG_PASSWORD: kong
        KONG_PROXY_ACCESS_LOG: /dev/stdout
        KONG_ADMIN_ACCESS_LOG: /dev/stdout
        KONG_PROXY_ERROR_LOG: /dev/stderr
        KONG_ADMIN_ERROR_LOG: /dev/stderr
        KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
        - "8000:8000"
        - "8443:8443"
        - "8001:8001"
    networks:
        - enterprise-platform
  konga:
    image: pantsel/konga:latest
    container_name: konga
    hostname: konga
    restart: unless-stopped
    environment:
        NODE_ENV: development
        TOKEN_SECRET: OpenHubCRM-Konga-Secret
    ports:
        - "1337:1337"
    networks:
        - enterprise-platform
    depends_on:
        - kong
networks:
  enterprise-platform:
    external: true