global
    maxconn 100


defaults
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m


# Writes always go to postgres-1, the only primary. There is no automatic
# failover/promotion configured (that would need Patroni/repmgr) - if
# postgres-1 goes down, writes stop until a replica is manually promoted
# with pg_promote() and haproxy.cfg is updated to point here at it.
frontend postgres_write
    bind *:5432
    default_backend postgres_primary

backend postgres_primary
    server postgres-1 postgres-1:5432 check


# Reads are spread across the replicas, with postgres-1 as a backup target
# so read traffic still works (against the primary) if both replicas are down.
frontend postgres_read
    bind *:5433
    default_backend postgres_replicas

backend postgres_replicas
    balance roundrobin

    server postgres-2 postgres-2:5432 check
    server postgres-3 postgres-3:5432 check
    server postgres-1 postgres-1:5432 check backup
