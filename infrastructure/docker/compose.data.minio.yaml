name: openhubcrm-minio

services:
  minio-1:
    image: minio/minio:latest
    container_name: minio-1
    hostname: minio-1
    restart: unless-stopped
    command: >
      server
      http://minio-{1...4}/data
      --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123

    volumes:
      - ./minio/node1:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - enterprise-platform

  minio-2:
    image: minio/minio:latest
    container_name: minio-2
    hostname: minio-2
