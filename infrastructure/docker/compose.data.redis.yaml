name: openhubcrm-redis

services:
  redis-1:
    image: redis:7.4
    container_name: redis-1
    restart: unless-stopped
    command:
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
    volumes:
      - ./redis/node1:/data
    ports:
      - "7001:6379"
    networks:
      - enterprise-platform


  redis-2:
    image: redis:7.4
