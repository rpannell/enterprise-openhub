name: Deploy Redis Stack

on:
  workflow_dispatch:
    inputs:
      redis_password:
        description: "Redis Cluster password"
        required: true
        type: string

jobs:
  deploy-redis-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Detect act
        id: detect_act
        run: |
          if [ "$ACT" = "true" ]; then
            echo "running_under_act=true" >> $GITHUB_ENV
          else
            echo "running_under_act=false" >> $GITHUB_ENV
          fi

      - name: Validate redis_password
        run: |
          if [ -z "${{ github.event.inputs.redis_password }}" ]; then
            echo "ERROR: redis_password is required"
            exit 1
          fi

      - name: Install Helm
        if: env.running_under_act == 'false'
        run: |
          curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash

      - name: Install kubectl
        run: |
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            mv kubectl /usr/local/bin/
          else
            echo "kubectl already installed"
          fi

      - name: Ensure redis namespace exists
        if: env.running_under_act == 'false'
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl get namespace redis || kubectl create namespace redis

      - name: Create Redis password secret
        if: env.running_under_act == 'false'
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl delete secret redis-password -n redis --ignore-not-found
          kubectl create secret generic redis-password \
            --from-literal=password="${{ github.event.inputs.redis_password }}" \
            -n redis

      - if: env.running_under_act == 'false'
        name: Ensure Redis headless service exists
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f k8s/redis/redis-service.yaml


      - if: env.running_under_act == 'false'
        name: Apply Redis Cluster manifests
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f ${{ github.workspace }}/k8s/redis/redis-cluster.yaml

      - if: env.running_under_act == 'false'
        name: Wait for Redis pods to be ready
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl wait --for=condition=ready pod -l app=redis-cluster -n redis --timeout=300s



      - if: env.running_under_act == 'false'
        name: Initialize Redis Cluster
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl delete job redis-cluster-init -n redis --ignore-not-found
          kubectl apply -f ${{ github.workspace }}/k8s/redis/redis-cluster-init.yaml
          kubectl wait --for=condition=complete job/redis-cluster-init -n redis --timeout=120s

      - if: env.running_under_act == 'false'
        name: Deploy RedisInsight
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f ${{ github.workspace }}/k8s/redis/redis-insights.yaml

