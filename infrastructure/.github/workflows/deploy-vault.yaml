name: Deploy Vault and Consul

on:
  workflow_dispatch: {}

jobs:
  deploy-vault-consul:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Load local kubeconfig (for local act testing)
        run: |
          mkdir -p $HOME/.kube
          cp kubeconfig-act $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      # - name: Install Vault CLI and jq
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y jq curl gpg

      #     # Add HashiCorp GPG key
      #     curl -fsSL https://apt.releases.hashicorp.com/gpg \
      #       | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg

      #     # Add HashiCorp repo (non-interactive)
      #     echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com noble main" \
      #       | sudo tee /etc/apt/sources.list.d/hashicorp.list

      #     sudo apt-get update
      #     sudo apt-get install -y vault

      - name: Apply Vault manifests
        run: |
          export KUBECONFIG=/root/.kube/config

          kubectl apply --validate=false -f k8s/vault/namespace.yaml
          kubectl apply --validate=false -f k8s/vault/config.yaml
          kubectl apply --validate=false -f k8s/vault/service.yaml
          kubectl apply --validate=false -f k8s/vault/internal-service.yaml
          kubectl apply --validate=false -f k8s/vault/statefulset.yaml

          kubectl wait --for=condition=ready pod -l app=vault -n vault --timeout=300s

      - name: Vault & Consul deployment complete
        run: echo "Vault (Raft) and Consul cluster deployed and bootstrapped."
