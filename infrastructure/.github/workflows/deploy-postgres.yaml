name: Deploy PostgreSQL

on:
  workflow_dispatch:
    inputs:
      admin_password:
        description: "PostgreSQL admin password"
        required: true
        type: string

jobs:
  deploy-postgres:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # (Removed act detection logic)

      - name: Validate admin_password
        run: |
          if [ -z "${{ github.event.inputs.admin_password }}" ]; then
            echo "ERROR: admin_password is required"
            exit 1
          fi

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Load local kubeconfig (for local act testing)
        run: |
          mkdir -p $HOME/.kube
          cp kubeconfig-act $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Create postgres namespace
        run: |
          kubectl apply --validate=false -f k8s/postgres/namespace.yaml

      - name: Create postgres secret
        run: |
          kubectl create namespace postgres --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl delete secret postgres-credentials -n postgres --ignore-not-found || true
          kubectl create secret generic postgres-credentials \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=POSTGRES_PASSWORD="${{ github.event.inputs.admin_password }}" \
            -n postgres

      - name: Deploy PostgreSQL StatefulSet
        run: |
          kubectl apply --validate=false -f k8s/postgres/statefulset.yaml

      - name: Deploy PostgreSQL Services
        run: |
          kubectl apply --validate=false -f k8s/postgres/service.yaml

      - name: Wait for PostgreSQL pod to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=postgres -n postgres --timeout=300s

      - name: Deploy PgAdmin Secret
        run: |
          kubectl apply --validate=false -f k8s/postgres/pgadmin-secret.yaml

      - name: Deploy PgAdmin
        run: |
          kubectl apply --validate=false -f k8s/postgres/pgadmin.yaml

      - name: Verify PostgreSQL connectivity
        run: |
          kubectl run -it --rm debug --image=postgres:16-alpine --restart=Never -n postgres -- \
            pg_isready -h postgres-lb.postgres.svc.cluster.local -U postgres || true

      - name: PostgreSQL deployment complete
        run: |
          echo "PostgreSQL deployed and ready. Kong can now connect to postgres-lb.postgres.svc.cluster.local:5432"
          echo ""
          echo "PgAdmin is available at:"
          echo "  Ingress: http://pgadmin.local (add to hosts file)"
          echo "  Port-forward: kubectl port-forward -n postgres svc/pgadmin 8888:80"
          echo "  Login: admin@example.com / pgadmin123"


