name: Deploy Consul

on:
  workflow_dispatch: {}

jobs:
  deploy-consul:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/kubectl

      - name: Load local kubeconfig (for local act testing)
        run: |
          mkdir -p $HOME/.kube
          cp kubeconfig-act $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Apply Vault manifests
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f k8s/consul/namespace.yaml
          kubectl apply -f k8s/consul/service.yaml
          kubectl apply -f k8s/consul/statefulset.yaml
          kubectl wait --for=condition=ready pod -l app=consul -n consul --timeout=300s

      - name: Consul deployment complete
        run: echo "Consul cluster deployed."
