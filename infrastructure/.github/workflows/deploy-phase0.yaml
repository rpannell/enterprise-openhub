name: phase0-foundation-deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (local, dev, prod)"
        required: true
        default: "local"
        type: choice
        options:
          - local
          - dev
          - prod

jobs:
  phase0:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect WSL2
        run: |
          if uname -r | grep -qi "microsoft"; then
            echo "WSL2=true" >> $GITHUB_ENV
          else
            echo "WSL2=false" >> $GITHUB_ENV
          fi


      # -----------------------------
      # RESOLVE ENVIRONMENT VARIABLE
      # -----------------------------
      - name: Resolve ENVIRONMENT
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ -n "$ENVIRONMENT" ]; then
            echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          else
            echo "ERROR: ENVIRONMENT not provided"
            exit 1
          fi

      - name: Print ENVIRONMENT
        run: echo "ENVIRONMENT = $ENVIRONMENT"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # -------------------------
      # ADD HELM REPOSITORIES
      # -------------------------
      - name: Add Helm Repos
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo update

      # -------------------------
      # CERT-MANAGER INSTALLATION
      # -------------------------
      - name: Install cert-manager
        run: |
          VALUES="helm/cert-manager/values.${ENVIRONMENT}.yaml"
          echo "Using values file: $VALUES"
          NAMESPACE=$(yq '.namespace' "$VALUES")

          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$VALUES" \
            --wait

      # --------------------------------------
      # PROMETHEUS OPERATOR (NO GRAFANA)
      # --------------------------------------
      - name: Install kube-prometheus-stack
        run: |
          VALUES="helm/prometheus/values.${ENVIRONMENT}.yaml"
          echo "Using values file: $VALUES"
          NAMESPACE=$(yq '.namespace' "$VALUES")

          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$VALUES" \
            --wait

      - name: Wait for cert-manager webhook to be ready
        run: |
          kubectl rollout status deployment/cert-manager-webhook \
            -n platform-system --timeout=120s

      - name: Wait for cert-manager controller to be ready
        run: |
          kubectl rollout status deployment/cert-manager \
            -n platform-system --timeout=120s

      - name: Wait for cert-manager cainjector to be ready
        run: |
          kubectl rollout status deployment/cert-manager-cainjector \
            -n platform-system --timeout=120s


      # --------------------------------------
      # CLOUDNATIVEPG OPERATOR
      # --------------------------------------
      - name: Install CloudNativePG Operator
        if: env.WSL2 == 'false'
        run: |
          VALUES="helm/cnpg/values.${ENVIRONMENT}.yaml"
          NAMESPACE=$(yq '.namespace' "$VALUES")

          helm upgrade --install cnpg cnpg/cloudnative-pg \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$VALUES" \
            --wait

      - name: Remove CNPG webhooks (WSL2)
        if: env.WSL2 == 'true'
        run: |
          kubectl delete mutatingwebhookconfiguration cnpg-mutating-webhook-configuration --ignore-not-found
          kubectl delete validatingwebhookconfiguration cnpg-validating-webhook-configuration --ignore-not-found

      - name: Install Fake CNPG Operator (WSL2)
        if: env.WSL2 == 'true'
        run: |
          kubectl create namespace platform-system --dry-run=client -o yaml | kubectl apply -f -

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cnpg-cloudnative-pg
            namespace: platform-system
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: cnpg-fake
            template:
              metadata:
                labels:
                  app: cnpg-fake
              spec:
                containers:
                  - name: fake
                    image: busybox
                    command: ["sleep", "3600"]
          EOF



      # --------------------------------------
      # POSTGRESQL CLUSTER (platform-db)
      # --------------------------------------
      - name: Apply PostgreSQL Cluster
        run: |
          kubectl apply -f k8s/postgres/platform-db.yaml

      # --------------------------------------
      # PDB WRAPPER CHART
      # --------------------------------------
      - name: Install PDB wrapper chart
        run: |
          VALUES="helm/pdb-prometheus/values.${ENVIRONMENT}.yaml"
          echo "Using values file: $VALUES"
          NAMESPACE=$(yq '.namespace' "$VALUES")

          helm upgrade --install pdb-prometheus ./helm/pdb-prometheus \
            --namespace "$NAMESPACE" \
            -f "$VALUES" \
            --wait
