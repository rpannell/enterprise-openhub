name: Deploy RabbitMQ

on:
  workflow_dispatch:
    inputs:
      vault_url:
        description: "Vault URL"
        required: true
      vault_token:
        description: "Vault Token"
        required: true
      default_user:
        description: "RabbitMQ admin username"
        required: true
      default_password:
        description: "RabbitMQ admin password"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Load local kubeconfig (for local act testing)
        run: |
          mkdir -p $HOME/.kube
          cp kubeconfig-act $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Configure Vault for RabbitMQ (policy, role, secret)
        run: |
          export KUBECONFIG=/root/.kube/config

          VAULT_POD=$(kubectl get pod -n vault -l app=vault -o jsonpath="{.items[0].metadata.name}")

          echo "Logging into Vault..."
            kubectl exec -n vault $VAULT_POD -- sh -c "
              export VAULT_ADDR='http://127.0.0.1:8200'
              vault login \"${{ github.event.inputs.vault_token }}\" >/dev/null
            "


          echo "Ensuring KV engine is mounted at secret/..."
          kubectl exec -n vault $VAULT_POD -- sh -c '
            export VAULT_ADDR="http://127.0.0.1:8200"
            vault secrets list | grep -q "^secret/" || vault secrets enable -path=secret kv-v2
          '

          echo "Creating/Updating RabbitMQ Vault policy..."
          kubectl exec -n vault $VAULT_POD -- sh -c '
            export VAULT_ADDR="http://127.0.0.1:8200"

            cat <<'"EOF"' > /tmp/rabbitmq-policy.hcl
          path "secret/data/rabbitmq" {
            capabilities = ["read"]
          }
          path "secret/metadata/rabbitmq" {
            capabilities = ["read"]
          }
          EOF

            vault policy write rabbitmq /tmp/rabbitmq-policy.hcl
          '

          echo "Creating/Updating RabbitMQ Vault role..."
          kubectl exec -n vault $VAULT_POD -- sh -c "
            export VAULT_ADDR='http://127.0.0.1:8200'
            vault write auth/kubernetes/role/rabbitmq \
              bound_service_account_names='rabbitmq' \
              bound_service_account_namespaces='rabbitmq' \
              policies='rabbitmq' \
              ttl='24h'
          "

          echo "Ensuring RabbitMQ secret exists..."
          kubectl exec -n vault $VAULT_POD -- sh -c "
            export VAULT_ADDR='http://127.0.0.1:8200'
            vault kv put secret/rabbitmq \
              admin_user='${{ github.event.inputs.default_user }}' \
              admin_password='${{ github.event.inputs.default_password }}' \
              erlang_cookie='$(openssl rand -base64 32)'
          "

      - name: Deploy RabbitMQ Namespace
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f k8s/rabbitmq/namespace.yaml

      - name: Ensure RabbitMQ ServiceAccount exists
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl get serviceaccount rabbitmq -n rabbitmq >/dev/null 2>&1 || \
            kubectl create serviceaccount rabbitmq -n rabbitmq

      - name: Deploy RabbitMQ Service
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f k8s/rabbitmq/service.yaml

      - name: Deploy RabbitMQ StatefulSet
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f k8s/rabbitmq/statefulset.yaml
          kubectl wait --for=condition=ready pod -l app=rabbitmq -n rabbitmq --timeout=300s
