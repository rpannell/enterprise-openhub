name: Deploy RabbitMQ

on:
  workflow_dispatch:
    inputs:
      vault_url:
        description: "Vault URL"
        required: true
      vault_token:
        description: "Vault Token"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl


      - name: Load local kubeconfig (for local act testing)
        run: |
          mkdir -p $HOME/.kube
          cp kubeconfig-act $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      # - name: Install Vault CLI
      #   run: |
      #     VAULT_VERSION="1.15.0"
      #     curl -LO https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip
      #     sudo apt-get install -y unzip
      #     unzip vault_${VAULT_VERSION}_linux_amd64.zip
      #     sudo mv vault /usr/local/bin/

      - name: Ensure RabbitMQ Erlang cookie exists in Vault
        run: |
          export KUBECONFIG=/root/.kube/config

          # Get Vault pod
          VAULT_POD=$(kubectl get pod -n vault -l app=vault -o jsonpath="{.items[0].metadata.name}")

          echo "Logging into Vault..."
          kubectl exec -n vault $VAULT_POD -- sh -c "
            export VAULT_ADDR='http://127.0.0.1:8200'
            vault login '${{ github.event.inputs.vault_token }}' >/dev/null
          "

          echo "Detecting KV engine version for 'secret/'..."
          KV_INFO=$(kubectl exec -n vault $VAULT_POD -- sh -c "
            export VAULT_ADDR='http://127.0.0.1:8200'
            vault secrets list
          ")

          if echo \"$KV_INFO\" | grep -q \"secret/.*kv-v2\"; then
            KV_VERSION=\"v2\"
          else
            KV_VERSION=\"v1\"
          fi

          echo \"KV engine version detected: $KV_VERSION\"

          echo \"Checking for existing Erlang cookie...\"
          if [ \"$KV_VERSION\" = \"v2\" ]; then
            EXISTING=$(kubectl exec -n vault $VAULT_POD -- sh -c '
              export VAULT_ADDR=\"http://127.0.0.1:8200\"
              vault kv get -field=erlang_cookie secret/rabbitmq 2>/dev/null || true
            ')
          else
            EXISTING=$(kubectl exec -n vault $VAULT_POD -- sh -c '
              export VAULT_ADDR=\"http://127.0.0.1:8200\"
              vault read -field=erlang_cookie secret/rabbitmq 2>/dev/null || true
            ')
          fi

          if [ -n \"$EXISTING\" ]; then
            echo \"Erlang cookie already exists:\"
            echo \"$EXISTING\"
            exit 0
          fi

          echo \"No cookie found. Generating a new one...\"
          COOKIE=$(openssl rand -base64 32)

          echo \"Writing cookie to Vault...\"
          if [ \"$KV_VERSION\" = \"v2\" ]; then
            kubectl exec -n vault $VAULT_POD -- sh -c "
              export VAULT_ADDR='http://127.0.0.1:8200'
              vault kv put secret/rabbitmq erlang_cookie='$COOKIE'
            "
          else
            kubectl exec -n vault $VAULT_POD -- sh -c "
              export VAULT_ADDR='http://127.0.0.1:8200'
              vault write secret/rabbitmq erlang_cookie='$COOKIE'
            "
          fi

          echo \"Erlang cookie created:\"
          echo \"$COOKIE\"

      - name: Deploy RabbitMQ Namespace
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f k8s/rabbitmq/namespace.yaml

      - name: Ensure RabbitMQ ServiceAccount exists
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl get serviceaccount rabbitmq -n rabbitmq >/dev/null 2>&1 || \
            kubectl create serviceaccount rabbitmq -n rabbitmq

      - name: Deploy RabbitMQ Service
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f k8s/rabbitmq/service.yaml

      - name: Deploy RabbitMQ StatefulSet
        run: |
          export KUBECONFIG=/root/.kube/config
          kubectl apply -f k8s/rabbitmq/statefulset.yaml
          kubectl wait --for=condition=ready pod -l app=rabbitmq -n rabbitmq --timeout=300s