apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong
  labels:
    app: kong
spec:
  type: LoadBalancer
  selector:
    app: kong
  ports:
  - port: 80
    targetPort: proxy
    protocol: TCP
    name: proxy
  - port: 443
    targetPort: proxy
    protocol: TCP
    name: proxy-ssl
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong
  labels:
    app: kong
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
  - port: 8001
    targetPort: admin
    protocol: TCP
    name: admin
