apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-env-vars
  namespace: kong
data:
  KONG_DATABASE: postgres
  KONG_PG_HOST: postgres-lb.postgres.svc.cluster.local
  KONG_PG_PORT: "5432"
  KONG_PG_USER: postgres
  KONG_PG_PASSWORD: postgres-secret-password
  KONG_PG_DATABASE: kong
  KONG_PROXY_ACCESS_LOG: /dev/stdout
  KONG_ADMIN_ACCESS_LOG: /dev/stdout
  KONG_PROXY_ERROR_LOG: /dev/stderr
  KONG_ADMIN_ERROR_LOG: /dev/stderr
  KONG_ADMIN_LISTEN: 0.0.0.0:8001
  KONG_ADMIN_GUI_URL: http://kong-admin.kong.svc.cluster.local:8001
