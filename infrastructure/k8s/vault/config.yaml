apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = "true"
    }

    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }

    api_addr = "http://vault.vault.svc.cluster.local:8200"
    cluster_addr = "http://vault-0.vault-internal.vault.svc.cluster.local:8201"

    disable_mlock = true

    # Note: For Kong path rewriting to /vault, use Kong proxy-rewrite plugin
    # to strip /vault prefix from incoming requests
    # Example Kong route: /vault -> http://vault.vault.svc.cluster.local:8200
