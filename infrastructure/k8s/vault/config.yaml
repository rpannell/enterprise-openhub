apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    ui = true
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }

    storage "raft" {
      path = "/vault/data"
      node_id = "$(POD_NAME)"
    }

    cluster_addr = "http://$(POD_NAME).vault-internal:8201"
    api_addr     = "http://$(POD_NAME).vault-internal:8200"