apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 3
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/agent-inject-vault-addr: "http://vault.vault.svc:8200"
        vault.hashicorp.com/role: "rabbitmq"

        vault.hashicorp.com/agent-inject-secret-admin_user: "secret/rabbitmq"
        vault.hashicorp.com/agent-inject-secret-admin_password: "secret/rabbitmq"
        vault.hashicorp.com/agent-inject-secret-erlang_cookie: "secret/rabbitmq"

        vault.hashicorp.com/agent-inject-template-admin_user: |
          {{- with secret "secret/rabbitmq" -}}
          {{ .Data.data.admin_user }}
          {{- end }}

        vault.hashicorp.com/agent-inject-template-admin_password: |
          {{- with secret "secret/rabbitmq" -}}
          {{ .Data.data.admin_password }}
          {{- end }}

        vault.hashicorp.com/agent-inject-template-erlang_cookie: |
          {{- with secret "secret/rabbitmq" -}}
          {{ .Data.data.erlang_cookie }}
          {{- end }}

    spec:
      serviceAccountName: rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          command:
            - "bash"
            - "-c"
            - |
              # Load Vault-injected secrets
              export RABBITMQ_DEFAULT_USER="$(cat /vault/secrets/admin_user)"
              export RABBITMQ_DEFAULT_PASS="$(cat /vault/secrets/admin_password)"
              export RABBITMQ_ERLANG_COOKIE="$(cat /vault/secrets/erlang_cookie)"

              # Start RabbitMQ in background
              rabbitmq-server -detached
              rabbitmqctl await_startup

              # Create admin user (idempotent)
              rabbitmqctl add_user "$RABBITMQ_DEFAULT_USER" "$RABBITMQ_DEFAULT_PASS" || true
              rabbitmqctl set_user_tags "$RABBITMQ_DEFAULT_USER" administrator
              rabbitmqctl set_permissions -p / "$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"

              # Restart app cleanly
              rabbitmqctl stop_app
              rabbitmqctl start_app

              # Keep container alive
              tail -f /var/log/rabbitmq/*.log

          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management

          volumeMounts:
            - name: rabbit-data
              mountPath: /var/lib/rabbitmq

  volumeClaimTemplates:
    - metadata:
        name: rabbit-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
