apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  namespace: consul
spec:
  serviceName: consul
  replicas: 3
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.17
          args:
            - "agent"
            - "-server"
            - "-bootstrap-expect=3"
            - "-data-dir=/consul/data"
            - "-client=0.0.0.0"
            - "-ui"
            - "-bind=$(POD_IP)"
            - "-retry-join=consul-0.consul.consul.svc.cluster.local"
            - "-retry-join=consul-1.consul.consul.svc.cluster.local"
            - "-retry-join=consul-2.consul.consul.svc.cluster.local"
            # Note: For Kong path rewriting to /consul, use Kong request-transformer plugin
            # to strip /consul prefix from incoming requests before routing to Consul
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8500
              name: http
            - containerPort: 8301
              name: serf-lan
          volumeMounts:
            - name: data
              mountPath: /consul/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
