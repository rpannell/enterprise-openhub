apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-credentials
  namespace: platform-apps
type: Opaque
stringData:
  username: keycloak_user
  password: keycloak_supersecurepassword
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak-db
  namespace: platform-apps
spec:
  cluster:
    name: platform-db
    namespace: platform-system
  name: keycloak
  owner:
    name: keycloak_user
    secret:
      name: keycloak-db-credentials
