apiVersion: v1
kind: Secret
metadata:
  name: crm-db-credentials
  namespace: platform-apps
type: Opaque
stringData:
  username: crm_user
  password: supersecurepassword
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: crm-db
  namespace: platform-apps
spec:
  cluster:
    name: platform-db
    namespace: platform-system
  name: crm
  owner:
    name: crm_user
    secret:
      name: crm-db-credentials
