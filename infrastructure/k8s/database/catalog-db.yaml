apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-credentials
  namespace: platform-apps
type: Opaque
stringData:
  username: catalog_user
  password: catalog_supersecurepassword
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: catalog-db
  namespace: platform-apps
spec:
  cluster:
    name: platform-db
    namespace: platform-system
  name: catalog
  owner:
    name: catalog_user
    secret:
      name: catalog-db-credentials
